spring:
  datasource:
    url: jdbc:h2:mem:asyncflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  task:
    scheduling:
      enabled: false

asyncflow:
  outbox:
    enabled: false
  scanner:
    enabled: false
  report:
    storage-directory: ${java.io.tmpdir}/asyncflow-test-reports
